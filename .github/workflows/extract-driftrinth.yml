name: Extract Driftrinth renderer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original renderer assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/driftrinth
          unzip -q driftrinth.zip -d /tmp/driftrinth-source
          INDEX="$(find /tmp/driftrinth-source -type f -name index.html | head -n 1)"
          if [ -z "$INDEX" ]; then
            echo "No renderer index.html found in driftrinth.zip"
            find /tmp/driftrinth-source -maxdepth 4 -type f | head -100
            exit 1
          fi
          RENDERER_DIR="$(dirname "$INDEX")"
          echo "Using renderer at $RENDERER_DIR"
          cp -a "$RENDERER_DIR/." app/src/main/assets/driftrinth/
          find app/src/main/assets/driftrinth -type f -printf '%p %s bytes\n'
      - name: Commit extracted renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/driftrinth
          git commit -m "Add original Driftrinth renderer assets" || echo "No changes to commit"
          git push
