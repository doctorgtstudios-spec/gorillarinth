name: Build GorillaRinth APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare Gorilla Tag icon with transparent background
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          src = Image.open("images.jpeg").convert("RGB")
          flooded = src.copy()
          ImageDraw.floodfill(flooded, (0, 0), (255, 0, 255), thresh=38)
          pixels = src.load()
          marked = flooded.load()
          out = Image.new("RGBA", src.size, (0, 0, 0, 0))
          dst = out.load()
          for y in range(src.height):
              for x in range(src.width):
                  if marked[x, y] != (255, 0, 255):
                      r, g, b = pixels[x, y]
                      dst[x, y] = (r, g, b, 255)
          out.save("app/src/main/assets/gorillarinth/gorilla-icon.png")
          PY
          cp download.png app/src/main/assets/gorillarinth/download.png
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GorillaRinth-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
